<style>
/* Layout: fixed header + scrolling work area + bottom tab bar (iPad landscape first, stacks at phone width) */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --ink:#1C2321; --muted:#56615D; --line:#CFD6D3; --line-soft:#E6EBE9;
  --accent:#1F5E8C; --accent-ink:#FFFFFF; --warn:#9A4A06; --warn-bg:#FFF4E5; --bad:#B42318; --good:#1A7F37; --good-bg:#EAF6EE;
  --hatch:rgba(86,97,93,.22); --today:#1C2321; --chip-ink:#FFFFFF;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --nav-h:64px; --head-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1A1F1E; --ink:#E4EAE8; --muted:#9BA7A3; --line:#33403C; --line-soft:#252D2B;
  --accent:#86B9E2; --accent-ink:#0B1A26; --warn:#F2A65E; --warn-bg:#2E2213; --bad:#F47067; --good:#5BC47E; --good-bg:#15291C;
  --hatch:rgba(155,167,163,.22); --today:#E4EAE8; --chip-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1A1F1E; --ink:#E4EAE8; --muted:#9BA7A3; --line:#33403C; --line-soft:#252D2B;
  --accent:#86B9E2; --accent-ink:#0B1A26; --warn:#F2A65E; --warn-bg:#2E2213; --bad:#F47067; --good:#5BC47E; --good-bg:#15291C;
  --hatch:rgba(155,167,163,.22); --today:#E4EAE8; --chip-ink:#FFFFFF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.head{flex-shrink:0;min-height:var(--head-h);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.02em}
.head .sub{color:var(--muted);font-size:14px}
.head .sp{flex:1}
.pill{font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.pill b{font-size:15px}
.main{flex:1;min-height:0;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{height:var(--nav-h);border:0;background:transparent;font-size:14px;font-weight:500;color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:700}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.dash{border-style:dashed}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{min-height:42px;min-width:48px;padding:0 14px;border:0;background:var(--surface);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg.sm button{min-height:36px;min-width:40px;padding:0 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2,.h2{font-family:var(--f-display);font-size:16px;margin:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
input.in,select.in{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px;font-weight:400;color:var(--ink);width:100%;min-width:0}
input[type=color].in{padding:2px;width:52px}
.note{padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.6;border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn)}
.note.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.note.good{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.chip{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:700;color:var(--chip-ink);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;flex-shrink:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tbl-wrap{overflow-x:auto}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 8px}

/* Gantt */
.g-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-sw{width:20px;height:12px;border-radius:3px;display:inline-block}
.hatch{background-image:repeating-linear-gradient(45deg,var(--hatch) 0 3px,transparent 3px 7px)}
.g-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 250px);min-height:260px;position:relative}
.g-inner{position:relative}
.g-row{display:flex;border-bottom:1px solid var(--line-soft)}
.g-lab{position:sticky;left:0;z-index:5;width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;min-width:0}
.g-lab .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.g-lab .mt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.g-lab .tx{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.g-trk{position:relative;flex-shrink:0}
.g-head{position:sticky;top:0;z-index:6;background:var(--surface)}
.g-head .g-lab{z-index:7}
.g-day{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.1;border-right:1px solid var(--line-soft)}
.g-day.we{background:var(--bg)}
.g-day.td{background:var(--today);color:var(--bg);font-weight:700}
.g-mon{position:absolute;top:3px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;padding-left:5px;border-left:1px solid var(--line)}
.bar{position:absolute;top:9px;height:28px;border-radius:4px;overflow:hidden;border:0;padding:0;cursor:pointer}
.bar .fill{position:absolute;left:0;top:0;bottom:0}
.bar .lb{position:absolute;left:6px;top:5px;font-size:11px;font-weight:700;white-space:nowrap}
.bar.over{outline:2px solid var(--bad);outline-offset:-2px}
.ev{position:absolute;top:11px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:0;border-width:1px;border-style:solid}
.ov{position:absolute;pointer-events:none;z-index:2}
.load{position:absolute;bottom:6px;border-radius:2px}
.lag{font-size:11px;font-weight:700;flex-shrink:0}

/* Today */
.today-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.today-wrap{grid-template-columns:minmax(0,1fr)}}
.big{font-family:var(--f-display);font-size:22px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .val{flex:1;text-align:center;font-size:28px;font-weight:700}
.stepper .val small{font-size:14px;font-weight:500}
.sq{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:20px}
.allocbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--line-soft)}
.allocbar span{height:100%;border-right:2px solid var(--surface)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.task{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding-top:8px;border-top:1px solid var(--line-soft);margin-top:8px}
.task .k{font-size:12px;font-weight:700;color:var(--muted)}
.task .mn{font-size:13px;min-width:40px;text-align:right}
.tog{min-width:68px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700}
.tog[aria-pressed="true"]{color:var(--chip-ink)}
.reach{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);grid-column:2 / -1}
.reach input{width:84px;min-height:36px}

/* Today calendar */
.tcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:6px}
.tcal .hd{font-size:11px;color:var(--muted);text-align:center}
.tc{position:relative;height:40px;border:0;border-radius:8px;background:transparent;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.tc.off{opacity:.45}
.tc.td{box-shadow:inset 0 0 0 2px var(--today)}
.tc.on{background:var(--ink);color:var(--bg);font-weight:700}
.tc .rd{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.tc.on .rd{background:var(--bg)}
.tc .mk{font-style:normal;font-size:9px;font-weight:700;margin-top:1px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .hd{font-size:11px;color:var(--muted);text-align:center}
.cal .c{min-height:56px;border:1px solid var(--line-soft);border-radius:6px;padding:3px 4px;background:var(--surface);display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.cal .c.td{border:2px solid var(--today)}
.cal .c .n{font-size:11px;font-weight:500}
.cal .c.off{background:var(--bg)}
.tag{display:block;padding:1px 4px;border-radius:4px;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid;background:var(--surface);text-align:left;width:100%}
.hcal .c{min-height:44px;align-items:center;justify-content:center;font-size:14px}
.hcal .c.on{color:var(--bad);font-weight:700;border-color:var(--bad)}

/* Modal + toast */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.dlg h3{font-family:var(--f-display);font-size:18px;margin:0}
.dlg .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.mat-layout{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.mat-layout{grid-template-columns:minmax(0,1fr)}}
.mlist{display:flex;flex-direction:column;gap:4px}
.mitem{min-height:52px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.mitem[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mitem .mt{font-size:11px;opacity:.85}
.fg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.calc{color:var(--accent);font-weight:700}
#printHead{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root:not([data-theme="_"]):not([data-x]){--bg:#FFFFFF;--surface:#FFFFFF;--ink:#1C2321;--muted:#56615D;--line:#CFD6D3;--line-soft:#E6EBE9;--accent:#1F5E8C;--accent-ink:#FFFFFF;--warn:#9A4A06;--warn-bg:#FFF4E5;--bad:#B42318;--good:#1A7F37;--good-bg:#EAF6EE;--hatch:rgba(86,97,93,.22);--today:#1C2321;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body,#app{height:auto!important;display:block!important}
  #printHead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:10px;font-size:14px}
  .head,.nav,.g-tools,.toast,.btn,.sq,.seg,.reach,#modal{display:none!important}
  .main{overflow:visible!important;padding:0!important}
  .g-scroll{overflow:visible!important;max-height:none!important;min-height:0!important;border:0}
  .no-print{display:none!important}
  .g-lab,.g-head{position:static!important}
  .card,.note,tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="printHead"></div>

  var r=st.weekMin[dow(d)]>0&&!st.holidays[d]&&!isMockDay(st,d);memo.study[k]=r;return r;
}
function availMin(st,d){if(st.holidays[d]||isMockDay(st,d))return 0;var o=st.overrides[d];return o!=null?o:st.weekMin[dow(d)]}
function countStudy(st,a,b){if(!a||!b||b<a)return 0;var n=0,d=a,g=0;while(d<=b&&g<1500){if(isStudy(st,d))n++;d=addD(d,1);g++}return n}
function nthStudy(st,start,n){var d=start,c=0,g=0;while(g<1500){if(isStudy(st,d)){c++;if(c>=n)return d}d=addD(d,1);g++}return d}
function prevStudy(st,d){var x=addD(d,-1),g=0;while(g<90){if(isStudy(st,x))return x;x=addD(x,-1);g++}return null}
function nextStudy(st,d,avoid){var x=addD(d,1),g=0;while(g<120){if(isStudy(st,x)&&!(avoid&&avoid(x)))return x;x=addD(x,1);g++}return null}
function roundCalc(st,m,i){

  var r=m.rounds[i]||{},tot=Math.max(1,num(m.total,1)),res={start:r.start||null,end:null,ppd:0,days:0,ok:false};
  if(r.start){
    if(m.method==="B"){var p=Math.max(1,num(r.ppd,1));res.ppd=p;res.days=Math.ceil(tot/p);res.end=nthStudy(st,r.start,res.days);res.ok=true}
    else if(r.end&&r.end>=r.start){res.end=r.end;res.days=countStudy(st,r.start,r.end);res.ppd=res.days?Math.ceil(tot/res.days):tot;res.ok=res.days>0}
  }
  memo.rc[key]=res;return res;
}
function mppOf(m,i){var r=m.rounds[i],v=r?num(r.mpp,NaN):NaN;return isFinite(v)&&v>0?v:Math.max(.1,num(m.mpp,1))}
function recIndex(){

  Object.keys(L).forEach(function(mo){var R=L[mo].recs||{};Object.keys(R).forEach(function(k){var v=R[k];if(!v)return;var p=k.split("|");(idx[p[1]]=idx[p[1]]||[]).push({date:p[0],round:v.round,from:v.from,to:v.to,pages:v.pages,min:v.min})})});
  memo.rec=idx;return idx;
}
function getRec(d,mid){var L=(S.logs[S.sid]||{})[monthOf(d)];return L&&L.recs?L.recs[d+"|"+mid]||null:null}
function getCheck(d,key){var L=(S.logs[S.sid]||{})[monthOf(d)];return!!(L&&L.checks&&L.checks[d+"|"+key])}
function doneIn(m,i,before,extra){var a=recIndex()[m.id]||[],s=0;a.forEach(function(r){if(r.round===i&&(!before||r.date<before))s+=num(r.pages,0)});return s+(extra&&extra[i]||0)}
function curRound(m,before,extra){var t=num(m.total,0);for(var i=0;i<m.rounds.length;i++){if(doneIn(m,i,before,extra)<t)return i}return-1}
function expectedAt(st,m,i,x){var rc=roundCalc(st,m,i);if(!rc.ok||x<rc.start)return 0;return Math.floor(num(m.total,0)*countStudy(st,rc.start,x<rc.end?x:rc.end)/Math.max(1,rc.days))}
function planNew(st,m,d,extra){
  if(!isStudy(st,d))return null;var i=curRound(m,d,extra);if(i<0)return null;var rc=roundCalc(st,m,i);if(!rc.ok||d<rc.start)return null;
  var done=doneIn(m,i,d,extra),rem=num(m.total,0)-done;if(rem<=0)return null;
  var p=d<=rc.end?Math.ceil(rem/Math.max(1,countStudy(st,d,rc.end))):rc.ppd;
  var cu=m.catchUp;if(cu&&cu.round===i&&d<=cu.until&&d<=rc.end){var need=expectedAt(st,m,i,cu.until)-done;if(need>0)p=Math.max(p,Math.ceil(need/Math.max(1,countStudy(st,d,cu.until))))}
  p=Math.min(p,rem);

function reviewOf(st,m,d){

  return{date:p,from:r.from,to:r.to,pages:r.pages,min:Math.round(r.pages*mppOf(m,r.round)*st.reviewRate/100)};

function pastSetOf(st,id){return st.pastSets.find(function(x){return x.id===id})}
function fixedOf(st,d){
  var out=[];
  st.mocks.forEach(function(m){if(m.date===d)out.push({key:"mock:"+m.id,kind:"模試",label:m.name,min:0,color:null});
    if(m.reviewDate===d)out.push({key:"mockrev:"+m.id,kind:"模試復習",label:m.name+" の復習",min:num(m.reviewMin,120),color:null})});
  st.pastItems.forEach(function(it){var ps=pastSetOf(st,it.setId);if(!ps)return;var sj=subjById(st,ps.subjectId),ex=examById(st,ps.examId);
    var nm=(ex?ex.name+" ":"")+(sj?sj.name:"")+" 過去問 第"+it.no+"回";
    if(it.date===d)out.push({key:"past:"+it.id,kind:"過去問",label:nm,min:num(ps.min,50),color:sj&&sj.color,item:it});
    if(it.reviewDate===d)out.push({key:"pastrev:"+it.id,kind:"過去問復習",label:nm+" の復習",min:num(ps.reviewMin,30),color:sj&&sj.color,item:it})});

function dayPlan(st,d){
  var avail=availMin(st,d),fixed=fixedOf(st,d),mockDay=isMockDay(st,d);
  var fixedMin=fixed.reduce(function(a,f){return a+f.min},0);
  var subs=st.subjects.map(function(sj){
    var items=st.materials.filter(function(m){return m.subjectId===sj.id}).map(function(m){
      var pl=mockDay?null:planNew(st,m,d),rv=mockDay?null:reviewOf(st,m,d);
      return{m:m,plan:pl,rev:rv,need:pl?pl.min:0}}).filter(function(x){return x.plan||x.rev||getRec(d,x.m.id)});
    var need=items.reduce(function(a,x){return a+x.need},0),rev=items.reduce(function(a,x){return a+(x.rev?x.rev.min:0)},0);
    return{sj:sj,items:items,need:need,rev:rev,alloc:need};
  }).filter(function(s){return s.items.length});
  var revTotal=subs.reduce(function(a,s){return a+s.rev},0),needTotal=subs.reduce(function(a,s){return a+s.need},0);
  var T=Math.max(0,avail-fixedMin-revTotal),adjusted=needTotal>T;
  if(adjusted){
    var act=subs.filter(function(s){return s.need>0}),rem=T,g=0;
    subs.forEach(function(s){s.alloc=0});
    while(act.length&&g<20){g++;
      var ws=act.reduce(function(a,s){return a+s.need*PRIO[s.sj.prio||"中"]},0);if(ws<=0)break;
      var capped=act.filter(function(s){return rem*s.need*PRIO[s.sj.prio||"中"]/ws>=s.need});
      if(!capped.length){act.forEach(function(s){s.alloc=rem*s.need*PRIO[s.sj.prio||"中"]/ws});break}
      capped.forEach(function(s){s.alloc=s.need;rem-=s.need});act=act.filter(function(s){return capped.indexOf(s)<0});
    }
  }
  var newUsed=0,cut=0,cutMin=0;
  subs.forEach(function(s){
    s.items.forEach(function(x){
      if(!x.plan){x.pages=0;x.min=0;return}
      var a=s.need?s.alloc*x.need/s.need:0,mpp=mppOf(x.m,x.plan.round);
      x.pages=adjusted?Math.min(x.plan.pages,Math.floor(a/mpp+1e-9)):x.plan.pages;
      x.min=Math.round(x.pages*mpp);x.from=x.plan.from;x.to=x.plan.from+x.pages-1;
      cut+=x.plan.pages-x.pages;cutMin+=x.plan.min-x.pages*mpp;newUsed+=x.min;
    });
    s.total=s.rev+s.items.reduce(function(a,x){return a+(x.min||0)},0);
  });
  return{avail:avail,fixed:fixed,fixedMin:fixedMin,mockDay:mockDay,subs:subs,revTotal:revTotal,needTotal:needTotal,adjusted:adjusted,
    T:T,newUsed:newUsed,cut:cut,cutMin:Math.round(cutMin),used:fixedMin+revTotal+newUsed};

function lagOf(st,m){
  var t=todayS(),y=addD(t,-1),i=curRound(m,t);if(i<0)return{done:true};var rc=roundCalc(st,m,i);if(!rc.ok||y<rc.start)return{lag:0,i:i};
  var planned=Math.floor(num(m.total,0)*countStudy(st,rc.start,y<rc.end?y:rc.end)/Math.max(1,rc.days));return{lag:planned-doneIn(m,i,t),i:i};

function plannedLoad(st,d,exclude){
  if(!isStudy(st,d))return fixedOf(st,d).reduce(function(a,f){return a+f.min},0);
  var sum=0;st.materials.forEach(function(m){if(m.id===exclude)return;for(var i=0;i<m.rounds.length;i++){var rc=roundCalc(st,m,i);if(rc.ok&&d>=rc.start&&d<=rc.end){sum+=rc.ppd*mppOf(m,i)*(1+st.reviewRate/100);break}}});
  return Math.round(sum+fixedOf(st,d).reduce(function(a,f){return a+f.min},0));
}

/* 過去問の自動配置 */
function autoPlace(st){
  var used={},wk={};
  var blocked=function(d){return!isStudy(st,d)||isMockRev(st,d)};
  var weekKey=function(d){return addD(d,-((dow(d)+6)%7))};
  st.pastItems.forEach(function(it){if(it.fixed&&it.date){used[it.date]=(used[it.date]||0)+1;var w=weekKey(it.date);wk[w]=(wk[w]||0)+1}});
  var sets=st.pastSets.slice().sort(function(a,b){return num(b.count,0)-num(a.count,0)});
  var keep=st.pastItems.filter(function(it){return it.fixed&&sets.some(function(s){return s.id===it.setId})});
  var plan={};sets.forEach(function(s){
    var ex=examById(st,s.examId),end=s.end||(ex?addD(ex.date,-PAST_END):null),start=s.start||(ex?addD(ex.date,-PAST_START):todayS());
    var days=[];if(end){var d=start,g=0;while(d<=end&&g<800){if(!blocked(d))days.push(d);d=addD(d,1);g++}}
    plan[s.id]={days:days,n:Math.max(0,num(s.count,0))};
  });
  var maxN=sets.reduce(function(a,s){return Math.max(a,plan[s.id].n)},0),items=keep.slice(),miss=0;
  for(var k=0;k<maxN;k++){sets.forEach(function(s){
    var P=plan[s.id];if(k>=P.n)return;var no=k+1;
    if(keep.some(function(it){return it.setId===s.id&&it.no===no}))return;
    var D=P.days,a=Math.floor(D.length*k/P.n),b=Math.floor(D.length*(k+1)/P.n),seg=D.slice(a,b);
    var cand=seg.filter(function(d){return(used[d]||0)<st.pastLimit}).sort(function(x,y){
      var wx=wk[weekKey(x)]||0,wy=wk[weekKey(y)]||0;if(wx!==wy)return wx-wy;
      var mx=st.weekMin[dow(x)],my=st.weekMin[dow(y)];if(mx!==my)return my-mx;return x<y?-1:1});
    var ex=examById(st,s.examId),d=null,rv=null;
    for(var c=0;c<cand.length;c++){var r2=nextStudy(st,cand[c],function(x){return isMockRev(st,x)});if(!ex||(r2&&r2<ex.date)){d=cand[c];rv=r2;break}}
    if(!d){miss++;return}
    used[d]=(used[d]||0)+1;wk[weekKey(d)]=(wk[weekKey(d)]||0)+1;
    items.push({id:"p"+uid(),setId:s.id,no:no,date:d,reviewDate:rv,fixed:false,score:""});
  })}
  st.pastItems=st.pastItems.filter(function(it){return!sets.some(function(s){return s.id===it.setId})}).concat(items);
  return miss;
}

  var ov="",top=46;
  for(var k=0;k<R.n;k++){var d3=addD(R.lo,k);if(st.holidays[d3]||isMockDay(st,d3))ov+='<div class="ov hatch" style="left:'+(LW+k*cw)+'px;width:'+cw+'px;top:'+top+'px;bottom:0"></div>'}
  if(t>=R.lo&&t<=R.hi)ov+='<div class="ov" style="left:'+(LW+x(t)+cw/2-1)+'px;width:2px;top:'+top+'px;bottom:0;background:var(--today)"></div>';
  st.exams.forEach(function(e){if(e.date<R.lo||e.date>R.hi)return;ov+='<div class="ov" style="left:'+(LW+x(e.date)+cw/2-1)+'px;width:2px;top:18px;bottom:0;background:var(--bad)"></div><div class="ov" style="left:'+(LW+x(e.date)+cw/2+3)+'px;top:'+(top+2)+'px;font-size:11px;font-weight:700;color:var(--bad);white-space:nowrap;background:var(--surface);padding:0 3px;z-index:3">'+esc(e.name)+'</div>'});
  var warn=ganttWarnings(st,R);
  return h+'<div class="g-scroll" id="gscroll"><div class="g-inner" style="width:'+(LW+W)+'px">'+hd+evr+rows+ld+ov+'</div></div>'+
    '<div class="row" style="margin-top:10px">'+warn+'<span class="small muted no-print">バーをタップ：教材の編集　／　行の日付部分をタップ：その日の記録を入力　／　日付の見出しをタップ：その日の「今日の計画」を表示</span></div>';
}
function w0(d){return dow(d)===1}
function ganttWarnings(st,R){
  var t=todayS(),over=[];for(var i=0;i<45;i++){var d=addD(t,i);var v=plannedLoad(st,d),c=availMin(st,d);if(c>0&&v>c)over.push(d)}
  if(!over.length)return"";
  return'<div class="note bad" style="flex:1">今後45日のうち'+over.length+'日（初回 '+fmtW(over[0])+'）は、計画上の所要時間が標準学習時間を超えます。教材の期間又は1日ページ数を見直してください。</div>';

/* --- 今日の計画 --- */

  left+='<div class="card stack" style="gap:10px"><div class="row between"><span class="h2" style="font-size:14px">時間配分</span><span><b>'+P.used+'</b> / '+P.avail+'分</span></div><div class="allocbar">'+
    (P.fixedMin?'<span style="width:'+(P.fixedMin/tot*100)+'%;background:var(--ink)"></span>':'')+

    (P.fixedMin?'<div class="row small"><i class="dot" style="background:var(--ink)"></i><span style="flex:1">固定予定</span><b>'+P.fixedMin+'分</b></div>':'')+
    P.subs.map(function(s){var nw=s.total-s.rev;return'<div class="row small"><i class="dot" style="background:'+esc(s.sj.color)+'"></i><span style="width:3.5em">'+esc(s.sj.name)+'</span><span class="muted" style="flex:1">復習 '+s.rev+'分 ＋ 新規 '+nw+'分</span><b>'+s.total+'分</b></div>'}).join("")+
    '<div class="row small muted"><i class="dot" style="background:var(--line-soft)"></i><span style="flex:1">余り</span><span>'+Math.max(0,P.avail-P.used)+'分</span></div></div>';
  if(P.adjusted&&P.needTotal>0)left+='<div class="note">予定合計'+(P.fixedMin+P.revTotal+P.needTotal)+'分が学習可能時間'+P.avail+'分を超えたため、固定予定と教材の復習を確保し、残り'+P.T+'分を優先度に応じて新規に配分しました。新規'+P.cut+'ページ（'+P.cutMin+'分）は翌日以降に繰り越します。</div>';
  if(P.fixedMin>P.avail)left+='<div class="note bad">固定予定だけで学習可能時間を超えています。</div>';
  left+='</section>';
  var right='<section class="stack"><div class="row between"><span class="h2">科目別の学習内容（復習 → 新規）</span></div>';
  if(P.fixed.length){right+='<div class="card"><div class="h2" style="font-size:14px">固定予定</div>'+P.fixed.map(function(f){var on=getCheck(d,f.key),c=f.color||"var(--ink)";
    return'<div class="task" style="grid-template-columns:72px minmax(0,1fr) auto auto"><span class="k">'+f.kind+'</span><span>'+esc(f.label)+'</span><span class="mn">'+(f.min?f.min+"分":"終日")+'</span><button class="tog" data-act="check" data-k="'+esc(f.key)+'" aria-pressed="'+on+'" style="'+(on?"background:"+c+";border-color:"+c+(c==="var(--ink)"?";color:var(--bg)":""):"")+'">'+(on?"✓ 済":"済")+'</button></div>'}).join("")+'</div>'}

  right+='<div class="cards">'+P.subs.map(function(s){
    return'<div class="card"><div class="row"><span class="chip" style="background:'+esc(s.sj.color)+'">'+esc(s.sj.name)+'</span><span class="small muted" style="border:1px solid var(--line);border-radius:4px;padding:0 6px">優先度 '+esc(s.sj.prio||"中")+'</span><span class="sp" style="flex:1"></span><span class="small muted">割当 <b style="color:var(--ink)">'+s.total+'分</b></span></div>'+
      s.items.map(function(x){var m=x.m,rec=getRec(d,m.id),rvOn=getCheck(d,"rev:"+m.id),c=s.sj.color,out="";
        out+='<div style="margin-top:10px;font-size:14px;font-weight:700">'+esc(m.name)+(x.plan?'<span class="small muted" style="font-weight:400">（'+(x.plan.round+1)+'周目）</span>':'')+'</div>';
        if(x.rev)out+='<div class="task"><span class="k">復習</span><span class="small">'+fmt(x.rev.date)+' p.'+x.rev.from+'–'+x.rev.to+'（'+x.rev.pages+'p）</span><span class="mn">'+x.rev.min+'分</span><button class="tog" data-act="check" data-k="rev:'+m.id+'" aria-pressed="'+rvOn+'" style="'+(rvOn?"background:"+esc(c)+";border-color:"+esc(c):"")+'">'+(rvOn?"✓ 済":"済")+'</button></div>';
        if(x.plan||rec){var on=!!rec;
          var txt=rec?'p.'+rec.from+'–'+rec.to+'（'+rec.pages+'p 記録済）':(x.pages>0?'p.'+x.from+'–'+x.to+'（'+x.pages+'p）':'今日は配分なし（繰越）');
          out+='<div class="task"><span class="k">新規</span><span class="small">'+txt+'</span><span class="mn">'+(rec?Math.round(rec.pages*mppOf(m,rec.round)):x.min)+'分</span><button class="tog" data-act="done" data-id="'+m.id+'" aria-pressed="'+on+'" style="'+(on?"background:"+esc(c)+";border-color:"+esc(c):"")+'"'+(!rec&&!x.pages?" disabled":"")+'>'+(on?"✓ 完了":"完了")+'</button>'+
            '<label class="reach">到達ページ<input class="in" type="number" inputmode="numeric" data-chg="reach" data-id="'+m.id+'" value="'+(rec?rec.to:"")+'" placeholder="'+(x.pages>0?x.to:"")+'">実施時間<input class="in" type="number" inputmode="numeric" data-chg="recmin" data-id="'+m.id+'" value="'+(rec&&rec.min?rec.min:"")+'" placeholder="分"'+(rec?"":" disabled")+'>分</label></div>'}
        return out}).join("")+'</div>'}).join("")+'</div></section>';

function todayCal(st,sel){
  var mo=S.tcMonth||monthOf(sel),first=pd(mo+"-01"),y=first.getFullYear(),m=first.getMonth(),n=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,t=todayS();
  var ev={};st.mocks.forEach(function(x){ev[x.date]="模"});st.pastItems.forEach(function(x){if(x.date&&!ev[x.date])ev[x.date]="過"});st.exams.forEach(function(x){ev[x.date]="受"});
  var h='<div class="card" style="padding:10px 12px"><div class="row between"><button class="sq" data-act="tcM" data-v="-1" aria-label="前の月" style="width:40px;height:36px">‹</button><b>'+y+'年'+(m+1)+'月</b><button class="sq" data-act="tcM" data-v="1" aria-label="次の月" style="width:40px;height:36px">›</button></div>'+
    '<div class="tcal">'+"月火水木金土日".split("").map(function(w,i){return'<span class="hd" style="'+(i===5?"color:var(--accent)":(i===6?"color:var(--bad)":""))+'">'+w+'</span>'}).join("");
  for(var i=0;i<lead;i++)h+='<span></span>';
  for(var dd=1;dd<=n;dd++){var d=mo+"-"+pad(dd),w=dow(d),on=d===sel,off=!isStudy(st,d),rec=st.materials.some(function(mm){return getRec(d,mm.id)});
    var col=on?"":(st.holidays[d]||w===0?"color:var(--bad)":(w===6?"color:var(--accent)":""));
    h+='<button class="tc'+(on?" on":"")+(d===t?" td":"")+(off&&!on?" off":"")+'" data-act="gotoDay" data-v="'+d+'" aria-label="'+fmtY(d)+'" aria-pressed="'+on+'" style="'+col+'"><span>'+dd+'</span>'+
      (ev[d]?'<i class="mk">'+ev[d]+'</i>':(rec?'<i class="rd"></i>':''))+'</button>'}
  return h+'</div><div class="small muted" style="margin-top:4px">●記録あり　受：受験日　模：模試　過：過去問　薄い日：学習日以外</div></div>';
}

/* --- 試験日程 --- */
function viewExams(st){
  var t=todayS();
  var exams='<div class="card"><div class="row between"><span class="h2">受験</span><button class="btn sm dash" data-act="exam">＋ 追加</button></div>'+
    (st.exams.length?'<div class="tbl-wrap"><table class="tbl" style="margin-top:6px"><thead><tr><th>名称</th><th>区分</th><th>受験日</th><th>残り</th></tr></thead><tbody>'+st.exams.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(e){
      return'<tr><td><button class="btn sm" data-act="exam" data-id="'+e.id+'" style="font-weight:700">'+esc(e.name)+'</button></td><td>'+esc(e.kind||"")+'</td><td>'+fmtY(e.date)+'（'+WD[dow(e.date)]+'）</td><td>'+(e.date>=t?"あと"+diffD(t,e.date)+"日":"終了")+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="small muted">受験日を追加してください。教材と過去問の期限に使います。</p>')+'</div>';
  var mocks='<div class="card"><div class="row between"><span class="h2">模試</span><button class="btn sm dash" data-act="mock">＋ 追加</button></div>'+
    (st.mocks.length?'<div class="tbl-wrap"><table class="tbl" style="margin-top:6px"><thead><tr><th>名称</th><th>実施日</th><th>復習日（所要）</th><th>状態</th></tr></thead><tbody>'+st.mocks.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(m){
      var dn=getCheck(m.date,"mock:"+m.id),rd=m.reviewDate&&getCheck(m.reviewDate,"mockrev:"+m.id);
      return'<tr><td><button class="btn sm" data-act="mock" data-id="'+m.id+'" style="font-weight:700">'+esc(m.name)+'</button></td><td>'+fmtW(m.date)+'</td><td>'+fmtW(m.reviewDate)+' '+num(m.reviewMin,120)+'分</td><td class="small" style="font-weight:700;color:'+(rd?"var(--muted)":"var(--accent)")+'">'+(rd?"復習済":(dn?"実施済":"予定"))+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="small muted">模試を追加すると、実施日は教材の学習から除外され、復習日に復習時間が確保されます。</p>')+'</div>';
  var past='<div class="card"><div class="row between"><span class="h2">過去問（科目別）</span><div class="row"><span class="small muted">1日の上限 '+st.pastLimit+'回</span><button class="btn sm dash" data-act="pastSet">＋ 追加</button><button class="btn sm pri" data-act="autoPlace"'+(st.pastSets.length?"":" disabled")+'>自動配置</button></div></div>'+
    (st.pastSets.length?'<div class="tbl-wrap"><table class="tbl" style="margin-top:6px"><thead><tr><th>科目</th><th>対象受験</th><th>回数</th><th>所要</th><th>復習</th><th>配置期間</th><th>配置／実施</th></tr></thead><tbody>'+st.pastSets.map(function(p){
      var sj=subjById(st,p.subjectId),ex=examById(st,p.examId),its=st.pastItems.filter(function(i){return i.setId===p.id}),dn=its.filter(function(i){return i.date&&getCheck(i.date,"past:"+i.id)}).length;
      var s=p.start||(ex?addD(ex.date,-PAST_START):""),e=p.end||(ex?addD(ex.date,-PAST_END):"");
      return'<tr><td><button class="btn sm" data-act="pastSet" data-id="'+p.id+'"><i class="dot" style="background:'+esc(sj?sj.color:"#888")+'"></i>&nbsp;'+esc(sj?sj.name:"（削除済）")+'</button></td><td>'+esc(ex?ex.name:"—")+'</td><td><b>'+num(p.count,0)+'回</b></td><td>'+num(p.min,50)+'分</td><td>'+num(p.reviewMin,30)+'分</td><td class="small">'+fmt(s)+'〜'+fmt(e)+'</td><td class="small">'+its.filter(function(i){return i.date}).length+'／'+dn+'</td></tr>'}).join("")+'</tbody></table></div>':'<p class="small muted">科目ごとに過去問の回数を設定し、「自動配置」を押すと、実施日と復習日を期間内に分散して割り当てます。</p>')+'</div>';
  return'<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))"><div class="stack">'+exams+mocks+'</div><div class="stack">'+past+examCal(st)+'</div></div>';
}
function examCal(st){
  var mo=S.calMonth,first=pd(mo+"-01"),y=first.getFullYear(),m=first.getMonth(),days=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7,t=todayS();
  var ev={};function add(d,o){(ev[d]=ev[d]||[]).push(o)}
  st.mocks.forEach(function(x){add(x.date,{l:x.name,c:"var(--ink)",f:true,act:"mock",id:x.id});if(x.reviewDate)add(x.reviewDate,{l:"模試 復習",c:"var(--ink)",f:false,act:"mock",id:x.id})});
  st.pastItems.forEach(function(it){var ps=pastSetOf(st,it.setId);if(!ps)return;var sj=subjById(st,ps.subjectId),n=(sj?sj.name:"")+it.no;
    if(it.date)add(it.date,{l:n+" 実施"+(it.fixed?"＊":""),c:sj?sj.color:"var(--ink)",f:true,act:"pastItem",id:it.id});
    if(it.reviewDate)add(it.reviewDate,{l:n+" 復習",c:sj?sj.color:"var(--ink)",f:false,act:"pastItem",id:it.id})});
  st.exams.forEach(function(e){add(e.date,{l:e.name+" 受験",c:"var(--bad)",f:true,act:"exam",id:e.id})});
  var h='<div class="card"><div class="row between"><span class="h2">配置結果</span><div class="row"><button class="sq" data-act="calM" data-v="-1" aria-label="前の月">‹</button><b style="min-width:7em;text-align:center">'+y+'年'+(m+1)+'月</b><button class="sq" data-act="calM" data-v="1" aria-label="次の月">›</button></div></div>'+
    '<div class="cal" style="margin-top:8px">'+"月火水木金土日".split("").map(function(w,i){return'<span class="hd" style="'+(i===5?"color:var(--accent)":(i===6?"color:var(--bad)":""))+'">'+w+'</span>'}).join("");
  for(var i=0;i<lead;i++)h+='<span></span>';
  for(var dd=1;dd<=days;dd++){var d=mo+"-"+pad(dd),off=!isStudy(st,d);
    h+='<div class="c'+(d===t?" td":"")+(off?" off":"")+'"><span class="n" style="color:'+(st.holidays[d]||dow(d)===0?"var(--bad)":(dow(d)===6?"var(--accent)":"var(--ink)"))+'">'+dd+(st.holidays[d]?" 休":"")+'</span>'+
      (ev[d]||[]).map(function(e){return'<button class="tag" data-act="'+e.act+'" data-id="'+e.id+'" style="border-color:'+e.c+';'+(e.f?"background:"+e.c+";color:"+(e.c==="var(--ink)"?"var(--bg)":"#fff"):"color:"+e.c)+'">'+esc(e.l)+'</button>'}).join("")+'</div>'}
  return h+'</div><div class="small muted" style="margin-top:6px">塗り：実施日　枠：復習日　＊：手動で固定した回（自動配置の対象外）。予定をタップすると編集できます。</div></div>';
}

/* --- 教材・計画 --- */
function viewMats(st){
  if(S.adj)return viewAdjust(st);
  var list='<div class="mlist">'+st.subjects.map(function(sj){var ms=st.materials.filter(function(m){return m.subjectId===sj.id});
    return'<div class="small muted" style="font-weight:700;padding:6px 4px 2px;display:flex;align-items:center;gap:6px"><i class="dot" style="background:'+esc(sj.color)+'"></i>'+esc(sj.name)+'</div>'+
      ms.map(function(m){return'<button class="mitem" data-act="editMat" data-id="'+m.id+'" aria-current="'+(S.matSel===m.id)+'"><span>'+esc(m.name)+'</span><span class="mt">'+num(m.total,0)+'p・'+m.rounds.length+'周</span></button>'}).join("")+
      (ms.length?"":'<span class="small muted" style="padding:0 8px">（教材なし）</span>')}).join("")+
    '<button class="btn dash" data-act="newMat" style="margin-top:10px">＋ 教材を追加</button></div>';
  var ed=S.draft?matEditor(st,S.draft):'<div class="card empty"><p>左の一覧から教材を選ぶか、「教材を追加」を押してください。</p></div>';
  return'<div class="mat-layout"><aside>'+list+'</aside><section>'+ed+'</section></div>';

function matEditor(st,m){
  var isNew=!st.materials.some(function(x){return x.id===m.id});
  var opt=function(arr,sel,lab){return arr.map(function(a){return'<option value="'+a.id+'"'+(a.id===sel?" selected":"")+'>'+esc(lab(a))+'</option>'}).join("")};
  var h='<div class="card stack"><div class="row between"><span class="h2" style="font-size:19px">'+(isNew?"教材の追加":"教材の編集")+'</span><div class="row">'+(isNew?"":'<button class="btn" data-act="adjust" data-id="'+m.id+'">遅れ調整</button><button class="btn danger" data-act="delMat">削除</button>')+'<button class="btn" data-act="cancelMat">閉じる</button><button class="btn pri" data-act="saveMat">保存</button></div></div>'+
    '<div class="fg3"><label class="f">教材名<input class="in" id="m-name" data-d="name" value="'+esc(m.name)+'"></label>'+
    '<label class="f">科目<select class="in" id="m-subj" data-d="subjectId">'+opt(st.subjects,m.subjectId,function(a){return a.name})+'</select></label>'+
    '<label class="f">目標受験<select class="in" id="m-exam" data-d="examId"><option value="">（最も早い受験）</option>'+opt(st.exams,m.examId,function(a){return a.name+"（"+fmt(a.date)+"）"})+'</select></label>'+
    '<label class="f">総ページ数<input class="in" id="m-total" type="number" inputmode="numeric" min="1" data-d="total" value="'+esc(m.total)+'"></label>'+
    '<label class="f">開始ページ<input class="in" id="m-sp" type="number" inputmode="numeric" min="1" data-d="startPage" value="'+esc(m.startPage)+'"></label>'+
    '<label class="f">1ページ所要時間の既定値（分）<input class="in" id="m-mpp" type="number" inputmode="decimal" min="0.1" step="0.1" data-d="mpp" value="'+esc(m.mpp)+'"></label></div>'+
    '<div class="row"><span class="small muted" style="font-weight:700">周回数</span><div class="seg sm" role="group" aria-label="周回数">'+[1,2,3,4,5].map(function(n){return'<button data-act="rounds" data-v="'+n+'" aria-pressed="'+(m.rounds.length===n)+'">'+n+'</button>'}).join("")+'</div>'+
    '<span class="small muted" style="font-weight:700;margin-left:12px">算出方式</span><div class="seg sm" role="group" aria-label="算出方式"><button data-act="method" data-v="A" aria-pressed="'+(m.method!=="B")+'">A 期間指定</button><button data-act="method" data-v="B" aria-pressed="'+(m.method==="B")+'">B 1日ページ数指定</button></div></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>周回</th><th>開始日</th><th>'+(m.method==="B"?"1日ページ数":"終了日")+'</th><th>1p所要（分）</th><th>学習日数</th><th>'+(m.method==="B"?"終了日（算出）":"1日ページ数（算出）")+'</th><th>所要／日</th></tr></thead><tbody id="rtb">'+roundRows(st,m)+'</tbody></table></div>'+
    '<div class="row"><button class="btn" data-act="split">目標受験日までを均等に割る</button><span class="small muted">青字は自動計算値です。1p所要が空欄の周回は既定値を使います。休止日と模試日は学習日数から除外します。</span></div><div id="msum">'+matSummary(st,m)+'</div></div>';
  return h;
}
function roundRows(st,m){
  return m.rounds.map(function(r,i){var rc=roundCalc(st,m,i);
    return'<tr><td><b>'+(i+1)+'周目</b></td><td><input class="in" type="date" data-r="'+i+'" data-k="start" value="'+(r.start||"")+'"></td><td>'+
      (m.method==="B"?'<input class="in" type="number" inputmode="numeric" min="1" data-r="'+i+'" data-k="ppd" value="'+(r.ppd||"")+'" style="max-width:110px">':'<input class="in" type="date" data-r="'+i+'" data-k="end" value="'+(r.end||"")+'">')+
      '</td><td><input class="in" type="number" inputmode="decimal" min="0.1" step="0.1" aria-label="'+(i+1)+'周目の1ページ所要時間" data-r="'+i+'" data-k="mpp" value="'+(r.mpp!=null?esc(r.mpp):"")+'" placeholder="'+esc(m.mpp)+'" style="max-width:90px"></td><td class="muted">'+(rc.ok?rc.days+"日":"—")+'</td><td class="calc">'+(rc.ok?(m.method==="B"?fmtY(rc.end):rc.ppd+" p/日"):"—")+'</td><td class="muted">'+(rc.ok?Math.round(rc.ppd*mppOf(m,i))+"分":"—")+'</td></tr>'}).join("");
}
function matSummary(st,m){
  var ex=targetExam(st,m),last=null,bad=false,prevEnd=null;
  m.rounds.forEach(function(r,i){var rc=roundCalc(st,m,i);if(!rc.ok){bad=true;return}if(prevEnd&&rc.start<=prevEnd)bad="ov";prevEnd=rc.end;last=rc.end});
  if(bad==="ov")return'<div class="note bad">周回の期間が前の周回と重なっています。開始日を見直してください。</div>';
  if(bad||!last)return'<div class="note">すべての周回に開始日と'+(m.method==="B"?"1日ページ数":"終了日")+'を入力してください。</div>';
  if(!ex)return'<div class="note good">最終周回の終了日：'+fmtY(last)+'（受験日が未登録です）</div>';
  var gap=diffD(last,ex.date)-1;
  return gap>=0?'<div class="note good">最終周回の終了日：'+fmtY(last)+'　目標受験（'+esc(ex.name)+' '+fmt(ex.date)+'）まで'+gap+'日の余裕があります。</div>':'<div class="note bad">最終周回の終了日（'+fmtY(last)+'）が目標受験日（'+esc(ex.name)+' '+fmt(ex.date)+'）以降です。</div>';
}

  if(M.type==="cell"){Store.patchLog(st.id,M.date,"recs",M.date+"|"+M.mid,null);closeModal();render();return}
  var t=M.type,id=M.id;
  var label={exam:"この受験",mock:"この模試",pastSet:"この過去問の設定と配置済みの日程"}[t];
  confirmBox(label+"を削除します。元に戻せません。","削除する",function(){
    if(t==="exam"){st.exams=st.exams.filter(function(x){return x.id!==id});st.materials.forEach(function(m){if(m.examId===id)m.examId=""})}
    if(t==="mock")st.mocks=st.mocks.filter(function(x){return x.id!==id});
    if(t==="pastSet"){st.pastSets=st.pastSets.filter(function(x){return x.id!==id});st.pastItems=st.pastItems.filter(function(x){return x.setId!==id})}
    closeModal();save(st)});
}

/* ========== 操作 ========== */
function newDraft(st){
  var t=todayS();return{id:"m"+uid(),name:"",subjectId:st.subjects[0]?st.subjects[0].id:"",examId:"",total:200,startPage:1,mpp:2,method:"A",rounds:[{start:t,end:"",ppd:""},{start:"",end:"",ppd:""},{start:"",end:"",ppd:""}]};
}
function draftCalc(){var st=stu(),m=S.draft;if(!st||!m)return;resetMemo();var tb=document.getElementById("rtb"),sm=document.getElementById("msum");
  // 既存入力のフォーカスを保つため、算出列と要約だけを更新する
  m.rounds.forEach(function(r,i){var rc=roundCalc(st,m,i),tr=tb&&tb.rows[i];if(!tr)return;
    tr.cells[4].textContent=rc.ok?rc.days+"日":"—";tr.cells[5].textContent=rc.ok?(m.method==="B"?fmtY(rc.end):rc.ppd+" p/日"):"—";tr.cells[6].textContent=rc.ok?Math.round(rc.ppd*mppOf(m,i))+"分":"—"});
  if(sm)sm.innerHTML=matSummary(st,m);
}
function chainStarts(st,m,from){ // 次周回の開始日の初期値＝前周回終了日の翌学習日
  resetMemo();for(var i=Math.max(1,from);i<m.rounds.length;i++){var prev=roundCalc(st,m,i-1);if(prev.ok&&!m.rounds[i].start){m.rounds[i].start=nextStudy(st,prev.end);resetMemo()}}
}
function splitEven(st,m){
  var ex=targetExam(st,m);if(!ex){toast("先に受験日を登録してください。");return false}
  var start=m.rounds[0]&&m.rounds[0].start||todayS(),end=addD(ex.date,-1);resetMemo();
  var days=[],d=start,g=0;while(d<=end&&g<1500){if(isStudy(st,d))days.push(d);d=addD(d,1);g++}
  var n=m.rounds.length;if(days.length<n){toast("目標受験日までの学習日が足りません。");return false}
  for(var i=0;i<n;i++){var a=Math.floor(days.length*i/n),b=Math.floor(days.length*(i+1)/n)-1;m.rounds[i].start=days[a];
    if(m.method==="B")m.rounds[i].ppd=Math.ceil(num(m.total,1)/(b-a+1));else m.rounds[i].end=days[b]}
  return true;
}

  cancelMat:function(){S.draft=null;S.matSel=null;render()},
  adjust:function(el){var st=stu(),id=el.dataset.id;S.adj=id;S.tab="mats";lsSet("gp-tab","mats");
    S.adjP={k:7,cut:1,newEnd:"",plus:0,unhol:false,low:"",pset:"",pcut:1};

  adjApply:function(el){var st=stu(),k=el.dataset.k,o=(S.adjCache||[]).find(function(x){return x.k===k});if(!o)return;var r=o.b();if(!r.st){toast(r.err||"反映できません。");return}
    confirmBox("「"+o.t+"」を計画に反映します。教材・日程の設定が変更されます。","反映する",function(){closeModal();S.adj=null;S.draft=null;Store.saveStudent(r.st);S.tab="gantt";lsSet("gp-tab","gantt");render();toast("「"+o.t+"」を反映しました。")})},
  rounds:function(el){var st=stu(),m=S.draft,n=+el.dataset.v;while(m.rounds.length<n){var lr=m.rounds[m.rounds.length-1];m.rounds.push({start:"",end:"",ppd:"",mpp:lr&&lr.mpp!=null?lr.mpp:""})}m.rounds=m.rounds.slice(0,n);chainStarts(st,m,1);render()},
  method:function(el){var st=stu(),m=S.draft;if(m.method===el.dataset.v)return;resetMemo();
    m.rounds.forEach(function(r,i){var rc=roundCalc(st,m,i);if(rc.ok){if(el.dataset.v==="B")r.ppd=rc.ppd;else r.end=rc.end}});m.method=el.dataset.v;render()},
  split:function(){var st=stu();if(splitEven(st,S.draft))render()},
  saveMat:function(){var st=stu(),m=S.draft;if(!m.name.trim()){toast("教材名を入力してください。");return}if(!(num(m.total,0)>0)){toast("総ページ数を入力してください。");return}
    m.total=num(m.total,1);m.startPage=num(m.startPage,1);m.mpp=num(m.mpp,1);m.rounds.forEach(function(r){var v=num(r.mpp,NaN);r.mpp=isFinite(v)&&v>0?v:""});
    var i=st.materials.findIndex(function(x){return x.id===m.id});if(i>=0)st.materials[i]=clone(m);else st.materials.push(clone(m));
    S.matSel=m.id;save(st);toast("保存しました。")},
  delMat:function(){var st=stu(),id=S.draft.id;confirmBox("この教材と計画を削除します。記録は残りますが表示されなくなります。","削除する",function(){st.materials=st.materials.filter(function(x){return x.id!==id});S.draft=null;S.matSel=null;closeModal();save(st)})},
  exam:function(el){dlgExam(stu(),el.dataset.id)},mock:function(el){dlgMock(stu(),el.dataset.id)},pastSet:function(el){dlgPastSet(stu(),el.dataset.id)},pastItem:function(el){dlgPastItem(stu(),el.dataset.id)},
  autoPlace:function(){var st=stu();resetMemo();var miss=autoPlace(st);save(st);toast(miss?"配置できなかった回が"+miss+"回あります。配置期間又は1日上限を見直してください。":"過去問の実施日と復習日を配置しました。")},
  unfix:function(){var st=stu(),it=st.pastItems.find(function(x){return x.id===M.id});it.fixed=false;closeModal();save(st);toast("固定を解除しました。次回の自動配置で再配置されます。")},
  calM:function(el){var d=pd(S.calMonth+"-01");d.setMonth(d.getMonth()+(+el.dataset.v));S.calMonth=ds(d).slice(0,7);render()},
  holM:function(el){var d=pd(S.holMonth+"-01");d.setMonth(d.getMonth()+(+el.dataset.v));S.holMonth=ds(d).slice(0,7);render()},

  addStudent:function(){dlgStudent()},
  pickStu:function(el){S.sid=el.dataset.id;lsSet("gp-sid",S.sid);S.draft=null;Store.watchLogs();render()},

    Store.auth.createUserWithEmailAndPassword(v.e.trim(),v.p).catch(function(e){lgMsg(authMsg(e))})},

      ids.forEach(function(id){var st=clone(o.students[id]);normalize(st);Store.saveStudent(st);var L=(o.logs||{})[id]||{};Object.keys(L).forEach(function(mo){Store.putMonth(id,mo,clone(L[mo]))})});

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  if(el.dataset.act==="cell"&&ev.target.closest(".bar"))return;
  var fn=A[el.dataset.act];if(fn){ev.preventDefault();fn(el,ev)}
});
document.addEventListener("input",function(ev){
  var el=ev.target;if(!S.draft||!el.closest("#main"))return;
  if(el.dataset.d){S.draft[el.dataset.d]=el.value;draftCalc()}
  if(el.dataset.r!=null){S.draft.rounds[+el.dataset.r][el.dataset.k]=el.value;draftCalc()}
});
document.addEventListener("change",function(ev){
  var el=ev.target,st=stu(),k=el.dataset.chg;
  if(S.draft&&el.dataset.r!=null){chainStarts(st,S.draft,+el.dataset.r+1);render();return}
  if(el.dataset.adj){S.adjP[el.dataset.adj]=el.type==="checkbox"?el.checked:el.value;render();return}
  if(!k)return;
  if(k==="stu"){S.sid=el.value;lsSet("gp-sid",S.sid);S.draft=null;Store.watchLogs();render();return}
  if(!st)return;
  if(k==="stuName"){var n=el.value.trim();if(n){st.name=n;save(st)}return}
  if(k==="num"){var v=num(el.value,null);if(v!=null&&v>=0){st[el.dataset.k]=v;save(st)}return}
  if(k==="week"){var w=num(el.value,null);if(w!=null&&w>=0){st.weekMin[+el.dataset.k]=w;save(st)}return}
  if(k==="subj"){var s=subjById(st,el.dataset.id);if(s){var val=el.value.trim();if(val){s[el.dataset.k]=val;save(st)}}return}
  if(k==="reach"){var d=S.date,m=st.materials.find(function(x){return x.id===el.dataset.id}),to=num(el.value,NaN);
    if(el.value===""){Store.patchLog(st.id,d,"recs",d+"|"+m.id,null);render();return}
    var i=Math.max(0,curRound(m,d)),rec=getRec(d,m.id);if(rec)i=rec.round;var from=rec?rec.from:num(m.startPage,1)+doneIn(m,i,d);
    if(!isFinite(to)||to<from){toast("到達ページは p."+from+" 以上で入力してください。");render();return}
    Store.patchLog(st.id,d,"recs",d+"|"+m.id,{round:i,from:from,to:to,pages:to-from+1,min:rec&&rec.min||null});render()}
  if(k==="recmin"){var d2=S.date,m2=st.materials.find(function(x){return x.id===el.dataset.id}),r2=getRec(d2,m2.id);if(!r2){toast("先にページを記録してください。");return}
    var mn=num(el.value,0);var nr=clone(r2);nr.min=mn>0?mn:null;Store.patchLog(st.id,d2,"recs",d2+"|"+m2.id,nr);render();return}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&modal.innerHTML)closeModal()});
document.getElementById("importFile").addEventListener("change",function(ev){
  var f=ev.target.files[0];ev.target.value="";if(!f)return;var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.app!=="study-planner"||!o.student||!o.student.id)throw 0;
    var exists=!!S.students[o.student.id];
    var go=function(){normalize(o.student);Store.saveStudent(o.student);Object.keys(o.logs||{}).forEach(function(mo){Store.putMonth(o.student.id,mo,o.logs[mo])});S.sid=o.student.id;lsSet("gp-sid",S.sid);closeModal();Store.watching=null;Store.watchLogs();render();toast("「"+o.student.name+"」を読み込みました。")};
    if(exists)confirmBox("「"+o.student.name+"」の現在のデータを、ファイルの内容で置き換えます。","置き換える",go);else go();
  }catch(e){toast("学習プランナーのバックアップファイルではありません。")}};rd.readAsText(f);
});

/* ========== 印刷 ========== */
function printFile(){
  var st=stu();if(!st)return;var titles={gantt:"ガントチャート",today:"今日の計画（"+fmtY(S.date)+"）",exams:"試験日程"};
  var ph=document.getElementById("printHead");ph.innerHTML='<b>'+esc(st.name)+'　'+esc(titles[S.tab]||"")+'</b><span>作成日 '+fmtY(todayS())+'</span>';
  var prev=S.view;if(S.tab==="gantt"&&S.view==="day"){S.view="week";S.ganttScroll=null;render();ph=document.getElementById("printHead")}
  var inner=document.querySelector(".g-inner");if(inner&&S.tab==="gantt"){var w=parseInt(inner.style.width,10)||1000;inner.style.zoom=Math.min(1,1060/w).toFixed(3)}
  setTimeout(function(){window.print();setTimeout(function(){if(inner)inner.style.zoom="";if(S.view!==prev){S.view=prev;render()}},800)},80);
}

function afterRender(st){
  if(S.tab==="gantt"){var g=document.getElementById("gscroll");if(!g)return;
    var sv=S.ganttScroll;if(sv&&sv.view===S.view&&sv.sid===S.sid){g.scrollLeft=sv.l;g.scrollTop=sv.t}else A.toToday()}
}

start();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
